<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- 徽章底 -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="#0a0e0a" stroke="#39ff14" stroke-opacity="0.22" stroke-width="2"/>
  <!-- 世界环：完整圆环 -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#e8e8e8" stroke-width="3.5"/>
  <!-- 传送门开口：用徽章底色矩形遮住环顶部，形成缺口（避免 arc flag 渲染歧义） -->
  <rect x="24.5" y="6" width="15" height="16" rx="3" fill="#0a0e0a"/>
  <!-- 绿色珍珠：嵌于顶部缺口，标记"这个世界" -->
  <circle cx="32" cy="14" r="3.5" fill="#39ff14"/>
</svg>
